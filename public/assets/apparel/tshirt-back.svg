<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <!-- Shadow gradient for natural depth -->
    <linearGradient id="tshirtShadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tshirtShadeR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="collarShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Drop Shadow behind garment -->
  <path d="M 200 45 C 150 50, 70 120, 30 180 C 15 205, 35 240, 75 220 L 135 185 L 140 590 C 140 605, 150 610, 170 610 L 430 610 C 450 610, 460 605, 460 590 L 465 185 L 525 220 C 565 240, 585 205, 570 180 C 530 120, 450 50, 400 45 C 365 45, 340 95, 300 95 C 260 95, 235 45, 200 45 Z" fill="#000000" opacity="0.15" filter="url(#softBlur)" transform="translate(0, 12)"/>

  <!-- Base Fabric Garment Body (Colored via CSS fill/currentColor) -->
  <path id="garmentBody" class="garment-color-fill" d="M 215 48 C 170 54, 90 122, 42 182 C 26 202, 38 238, 80 220 L 142 188 L 145 585 C 145 598, 155 604, 175 604 L 425 604 C 445 604, 455 598, 455 585 L 458 188 L 520 220 C 562 238, 574 202, 558 182 C 510 122, 430 54, 385 48 C 352 48, 332 94, 300 94 C 268 94, 248 48, 215 48 Z" fill="#1e1e1e"/>

  <!-- Left Sleeve Shade & Fold Lines -->
  <path d="M 42 182 C 55 195, 95 190, 142 188 L 140 170 L 85 140 Z" fill="#000000" opacity="0.12"/>
  <path d="M 42 182 L 80 220 C 70 224, 52 216, 42 182 Z" fill="#000000" opacity="0.2"/>
  <path d="M 142 188 L 138 230 C 137 250, 143 270, 144 290" stroke="#000000" stroke-width="2" stroke-opacity="0.15" fill="none"/>

  <!-- Right Sleeve Shade & Fold Lines -->
  <path d="M 558 182 C 545 195, 505 190, 458 188 L 460 170 L 515 140 Z" fill="#000000" opacity="0.12"/>
  <path d="M 558 182 L 520 220 C 530 224, 548 216, 558 182 Z" fill="#000000" opacity="0.2"/>
  <path d="M 458 188 L 462 230 C 463 250, 457 270, 456 290" stroke="#000000" stroke-width="2" stroke-opacity="0.15" fill="none"/>

  <!-- Torso Side Shading for 3D Volume -->
  <path d="M 142 188 L 145 585 C 145 598, 155 604, 175 604 L 210 604 L 180 200 Z" fill="url(#tshirtShadeL)"/>
  <path d="M 458 188 L 455 585 C 455 598, 445 604, 425 604 L 390 604 L 420 200 Z" fill="url(#tshirtShadeR)"/>

  <!-- Back Neckline (generated) -->
  <path class="garment-color-fill" d="M 213 47 C 253 62, 347 62, 387 47 C 350 50, 335.0 96, 300.0 96 C 265.0 96, 250 50, 213 47 Z" fill="#1e1e1e"/>
  <path d="M 215 48 C 253 62, 347 62, 385 48 C 347 38, 253 38, 215 48 Z" fill="#0d0d0d" opacity="0.5"/>
  <path d="M 215 48 C 253 62, 347 62, 385 48" stroke="#000000" stroke-width="7" stroke-opacity="0.18" fill="none"/>
  <path d="M 219 53 C 255 67, 345 67, 381 53" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15" fill="none"/>
  <path d="M 260.0 80 Q 300.0 90 340.0 80" stroke="#000000" stroke-width="1.4" stroke-opacity="0.12" fill="none"/>
<!-- Subtle Chest Natural Wrinkles / Folds -->
  <path d="M 160 215 Q 185 240 220 235" stroke="#000000" stroke-width="1.5" stroke-opacity="0.12" fill="none"/>
  <path d="M 440 215 Q 415 240 380 235" stroke="#000000" stroke-width="1.5" stroke-opacity="0.12" fill="none"/>
  <path d="M 148 380 Q 180 405 210 395" stroke="#000000" stroke-width="2" stroke-opacity="0.1" fill="none"/>
  <path d="M 452 380 Q 420 405 390 395" stroke="#000000" stroke-width="2" stroke-opacity="0.1" fill="none"/>
  <path d="M 155 520 Q 200 535 240 528" stroke="#000000" stroke-width="1.8" stroke-opacity="0.1" fill="none"/>
  <path d="M 445 520 Q 400 535 360 528" stroke="#000000" stroke-width="1.8" stroke-opacity="0.1" fill="none"/>

  <!-- Bottom Hem Stitching Line -->
  <path d="M 146 585 L 454 585" stroke="#000000" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="4,3" fill="none"/>
  <path d="M 146 589 L 454 589" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.15" fill="none"/>

  <!-- Sleeve Hem Stitching -->
  <path d="M 45 186 L 78 222" stroke="#000000" stroke-width="1.8" stroke-opacity="0.2" stroke-dasharray="4,3" fill="none"/>
  <path d="M 555 186 L 522 222" stroke="#000000" stroke-width="1.8" stroke-opacity="0.2" stroke-dasharray="4,3" fill="none"/>
</svg>
