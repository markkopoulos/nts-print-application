<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 650" width="100%" height="100%">
  <defs>
    <linearGradient id="swShadeL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="swShadeR" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlurSw" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>

  <!-- Shadow behind garment -->
  <path d="M 215 50 C 150 55, 75 140, 25 240 L 60 520 L 115 510 L 140 240 L 145 595 L 455 595 L 460 240 L 485 510 L 540 520 L 575 240 C 525 140, 450 55, 385 50 Z" fill="#000000" opacity="0.15" filter="url(#softBlurSw)" transform="translate(0, 10)"/>

  <!-- Sleeves Back Layer -->
  <path class="garment-color-fill" d="M 140 160 L 30 235 C 22 255, 40 500, 50 515 L 110 505 L 142 240 Z" fill="#1e1e1e"/>
  <path class="garment-color-fill" d="M 460 160 L 570 235 C 578 255, 560 500, 550 515 L 490 505 L 458 240 Z" fill="#1e1e1e"/>

  <!-- Sleeve Cuffs -->
  <path d="M 50 515 L 110 505 L 112 542 L 52 552 Z" fill="#000000" opacity="0.25"/>
  <path d="M 550 515 L 490 505 L 488 542 L 548 552 Z" fill="#000000" opacity="0.25"/>

  <!-- Main Body -->
  <path class="garment-color-fill" d="M 210 50 C 160 58, 142 135, 142 200 L 145 580 C 145 595, 155 605, 175 605 L 425 605 C 445 605, 455 595, 455 580 L 458 200 C 458 135, 440 58, 390 50 C 355 50, 335 95, 300 95 C 265 95, 245 50, 210 50 Z" fill="#1e1e1e"/>

  <!-- Body Side Shading -->
  <path d="M 142 200 L 145 580 L 195 580 L 175 200 Z" fill="url(#swShadeL)"/>
  <path d="M 458 200 L 455 580 L 405 580 L 425 200 Z" fill="url(#swShadeR)"/>

  <!-- Bottom Ribbed Hem -->
  <path d="M 145 560 L 455 560 L 455 605 L 145 605 Z" fill="#000000" opacity="0.2"/>
  <path d="M 145 560 L 455 560" stroke="#000000" stroke-width="2" stroke-opacity="0.2" fill="none"/>

  <!-- Inner Collar Back -->
  <path d="M 218 52 C 248 72, 352 72, 382 52 C 352 40, 248 40, 218 52 Z" fill="#0d0d0d" opacity="0.45"/>

  <!-- Front Collar Ribbing & Iconic V-Insert Stitching -->
  <path d="M 210 50 C 245 98, 355 98, 390 50 C 375 62, 348 108, 300 108 C 252 108, 225 62, 210 50 Z" fill="#111111" opacity="0.25"/>
  <path d="M 210 50 C 245 96, 355 96, 390 50" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.2" fill="none"/>
  
  <!-- Classic V-Notch stitch below collar -->
  <path d="M 285 108 L 300 130 L 315 108" stroke="#000000" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="3,2" fill="none"/>

  <!-- Natural Chest & Shoulder Folds -->
  <path d="M 160 215 Q 210 240 240 220" stroke="#000000" stroke-width="1.8" stroke-opacity="0.15" fill="none"/>
  <path d="M 440 215 Q 390 240 360 220" stroke="#000000" stroke-width="1.8" stroke-opacity="0.15" fill="none"/>
  <path d="M 160 380 Q 200 405 240 390" stroke="#000000" stroke-width="1.5" stroke-opacity="0.12" fill="none"/>
  <path d="M 440 380 Q 400 405 360 390" stroke="#000000" stroke-width="1.5" stroke-opacity="0.12" fill="none"/>
</svg>
